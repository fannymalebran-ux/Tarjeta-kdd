<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B3478">
  <title>Magdalena Tabilo Contreras | KDD SpA</title>
  <meta name="description" content="Tarjeta digital de Magdalena Tabilo Contreras, Ejecutiva Comercial de KDD SpA en Calama, Chile.">

  <style>
    :root{
      --navy:#0B3478;
      --orange:#FF6A00;
      --text:#15386F;
      --muted:#7284A2;
      --line:#D7E0EC;
      --bg:#F7F9FC;
      --white:#FFFFFF;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,#fff 0%,var(--bg) 100%);
    }
    .page{
      width:min(1080px,calc(100% - 24px));
      margin:0 auto;
      padding:30px 0 48px;
    }
    .card{
      position:relative;
      overflow:hidden;
      background:#fff;
      border:1px solid #E5EAF1;
      border-radius:28px;
      box-shadow:0 24px 65px rgba(9,45,100,.13);
    }
    .watermark{
      position:absolute;
      width:360px;
      height:360px;
      right:-95px;
      top:-120px;
      opacity:.07;
      pointer-events:none;
    }
    .accent{
      position:absolute;
      right:-70px;
      bottom:-105px;
      width:520px;
      height:230px;
      transform:rotate(-5deg);
      background:linear-gradient(160deg,transparent 0 39%,var(--orange) 39% 43%,var(--navy) 43% 100%);
      pointer-events:none;
    }
    .content{
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns:320px 1fr;
      gap:54px;
      padding:54px 58px 122px;
    }
    .brand{
      padding-right:34px;
      border-right:1px solid #A9B7CB;
    }
    .logo{
      display:block;
      width:100%;
      max-width:250px;
      margin:0 auto 26px;
    }
    .rule{
      width:165px;
      height:4px;
      border-radius:4px;
      background:var(--orange);
      margin:0 0 20px;
    }
    .slogan{
      font-size:19px;
      line-height:1.55;
      letter-spacing:.27em;
      text-transform:uppercase;
      color:var(--navy);
      max-width:255px;
    }
    h1{
      margin:12px 0 8px;
      color:var(--navy);
      font-size:clamp(34px,5vw,54px);
      line-height:1.02;
      letter-spacing:-.03em;
    }
    .role{
      margin:0 0 32px;
      color:var(--orange);
      font-size:clamp(24px,3vw,34px);
      font-weight:700;
    }
    .details{
      display:grid;
      gap:18px;
      margin-bottom:30px;
    }
    .detail{
      display:flex;
      align-items:center;
      gap:14px;
      font-size:20px;
    }
    .icon{
      width:48px;
      height:48px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#fff;
      background:var(--navy);
      flex:0 0 48px;
      font-weight:700;
      font-size:20px;
    }
    .detail:nth-child(1) .icon,
    .detail:nth-child(2) .icon{background:var(--orange)}
    a{color:inherit;text-decoration:none}
    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:28px;
    }
    .btn{
      min-height:48px;
      padding:0 18px;
      border-radius:13px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      border:1px solid var(--line);
    }
    .primary{background:var(--navy);color:#fff;border-color:var(--navy)}
    .secondary{background:#fff;color:var(--navy)}
    .values{
      position:absolute;
      z-index:3;
      left:58px;
      bottom:34px;
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.14em;
      font-size:13px;
    }
    .values b{color:var(--orange)}
    .note{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      margin-top:16px;
    }
    @media(max-width:820px){
      .page{padding-top:10px}
      .content{
        grid-template-columns:1fr;
        gap:28px;
        padding:32px 24px 122px;
      }
      .brand{
        border-right:none;
        border-bottom:1px solid #D4DBE6;
        padding:0 0 26px;
      }
      .logo{max-width:220px}
      .rule{margin-left:auto;margin-right:auto}
      .slogan{text-align:center;max-width:none;font-size:15px}
      h1,.role{text-align:center}
      .details{max-width:520px;margin-left:auto;margin-right:auto}
      .actions{justify-content:center}
      .values{left:24px;right:24px;justify-content:center}
      .accent{right:-220px}
    }
    @media(max-width:520px){
      .detail{align-items:flex-start;font-size:17px}
      .actions{display:grid;grid-template-columns:1fr}
      .btn{width:100%}
      .values{font-size:11px;gap:8px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">

      <!-- Logo vectorial embebido: no depende de archivos externos -->
      <svg class="watermark" viewBox="0 0 300 300" aria-hidden="true">
        <path d="M70 55 H118 V145 H70 Q52 145 52 126 V73 Q52 55 70 55Z" fill="#FF6A00"/>
        <path d="M132 55 H205 L155 126 H132 Z" fill="#FF6A00"/>

      <div class="accent"></div>

      <div class="content">

            <text x="30" y="275" font-family="Arial, Helvetica, sans-serif"

            <!-- KDD SpA -->
            <text x="82" y="325" font-family="Arial, Helvetica, sans-serif"
                  font-size="31" font-weight="700" letter-spacing="9" fill="#0B3478">KDD SpA</text>
          </svg>

          <div class="rule"></div>
          <div class="slogan">Soluciones que impulsan tu negocio</div>
        </aside>

        <section class="info">
          <h1>Magdalena Tabilo Contreras</h1>
          <div class="role">Ejecutiva Comercial</div>

          <div class="details">
            <div class="detail">
              <div class="icon">✉</div>
              <a href="mailto:tabilo.magdalena@gmail.com">tabilo.magdalena@gmail.com</a>
            </div>

            <div class="detail">
              <div class="icon">☎</div>
              <a href="tel:+56930901587">+56 9 3090 1587</a>
            </div>

            <div class="detail">
              <div class="icon">⌖</div>
              <span>Calama, Chile</span>
            </div>

            <div class="detail">
              <div class="icon">K</div>
              <span>KDD SpA</span>
            </div>
          </div>

          <div class="actions">
            <a class="btn primary" href="magdalena-tabilo.vcf" download>Guardar contacto</a>
            <a class="btn secondary" href="mailto:tabilo.magdalena@gmail.com">Enviar correo</a>
            <a class="btn secondary" href="https://wa.me/56930901587" target="_blank" rel="noopener">WhatsApp</a>
          </div>
        </section>
      </div>

      <div class="values">
        <span>Confianza</span><b>•</b>
        <span>Abastecimiento</span><b>•</b>
        <span>Crecimiento</span>
      </div>
    </section>

    <div class="note">KDD SpA · Calama, Chile</div>
  </main>
</body>
</html>
